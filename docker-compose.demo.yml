# Demo overlay: HTTP on loopback :8080, no TLS. Production compose topology stays.
# Pick it with COMPOSE_FILE in .env.demo (or --env-file .env.demo).
services:
  caddy:
    ports: !override
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile.demo:/etc/caddy/Caddyfile:ro
      - ./showcase:/srv/showcase:ro
