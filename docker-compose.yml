# mikeos-osm — self-hosted PLANET OpenStreetMap stack for MikeOS.
#
#   Overpass  → named-POI + tag/spatial search   (wiktorn/overpass-api, auto minute-diffs)
#   Nominatim → geocoding + reverse-geocoding     (mediagis/nominatim, auto replication)
#   OSRM      → routing (MLD, car)                (project-osrm, rebuilt periodically)
#   Caddy     → TLS + Bearer-token gate + routes  ( /overpass  /nominatim  /route )
#
# One box (Hetzner: Ryzen 9, 128 GB ECC, 3.84 TB+ NVMe). See README.md for the import runbook —
# Nominatim first (its import wants ~128 GB RAM), then Overpass + OSRM. Point NVMe at $DATA_DIR.

services:
  overpass:
    image: wiktorn/overpass-api:latest
    container_name: mikeos-overpass
    environment:
      OVERPASS_MODE: init                       # build a fresh DB from the planet file
      OVERPASS_META: "no"                        # 'attic' keeps full history (much bigger)
      # LOCAL FILE ONLY — never a network URL. The planet .osm.bz2 is downloaded ONCE on the HOST
      # (scripts/host-download.sh, aria2) into ${DATA_DIR}/planet-src, mounted read-only below.
      # wiktorn's entrypoint curl's file:// (returns HTTP 000, treated as success) → disk copy, no net.
      # This is deliberate: the container must NOT own the download (a failed init used to wipe /db
      # and re-pull the whole planet over the network — that burned us repeatedly).
      OVERPASS_PLANET_URL: ${OVERPASS_PLANET_URL}  # = file:///planet-src/planet.osm.bz2
      OVERPASS_DIFF_URL: ${REPLICATION_URL}
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_UPDATE_SLEEP: "3600"              # apply diffs hourly after the first import
    volumes:
      - ${DATA_DIR}/overpass:/db
      - ${DATA_DIR}/planet-src:/planet-src:ro   # host-downloaded planet file, read-only
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:4.4                # PostgreSQL 14 inside → data path below
    container_name: mikeos-nominatim
    # Local-file pattern (same rule as Overpass): for a FRESH import, download the .pbf on the HOST
    # (scripts/host-download.sh → /data/planet-src/planet.osm.pbf) and set PBF_PATH instead of PBF_URL:
    #   PBF_PATH: /planet-src/planet.osm.pbf     # + mount ${DATA_DIR}/planet-src:/planet-src:ro
    # (The very first import ran with PBF_URL; switch to PBF_PATH on the next re-import so nothing
    #  re-downloads inside the container.)
    environment:
      PBF_URL: ${PLANET_URL}
      REPLICATION_URL: ${REPLICATION_URL}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD}
      IMPORT_STYLE: full
      THREADS: ${THREADS}
    volumes:
      - ${DATA_DIR}/nominatim:/var/lib/postgresql/14/main
    shm_size: "2g"
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: mikeos-osrm
    # Requires the .osrm files built first — see scripts/osrm-build.sh (extract→partition→customize).
    command: osrm-routed --algorithm mld --max-table-size 8000 /data/planet.osrm
    volumes:
      - ${DATA_DIR}/osrm:/data
    restart: unless-stopped

  # Basemap tiles (Protomaps planet PMTiles) — reuses the mikeos-basemap container (go-pmtiles +
  # style + assets) as a plain-HTTP backend on :8082; the host Caddy fronts it at tiles.osmike.com.
  # Serving PMTiles is byte-range reads → negligible RAM. Clone milkosten/mikeos-basemap next to
  # this repo (../mikeos-basemap) so the build context resolves.
  basemap:
    build: ../mikeos-basemap
    container_name: mikeos-basemap
    environment:
      PORT: "8082"
      PUBLIC_URL: https://tiles.osmike.com
      PMTILES_DOWNLOAD_URL: ${PMTILES_DOWNLOAD_URL}
      SELF_HOST_ASSETS: "1"
    volumes:
      - ${DATA_DIR}/basemap:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: mikeos-caddy
    depends_on: [overpass, nominatim]
    ports:
      - "80:80"
      - "443:443"
    environment:
      OSM_DOMAIN: ${OSM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      OSM_TOKEN: ${OSM_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
    restart: unless-stopped
